name: Add gem price float once

on:
  push:
    branches: [main]
    paths:
      - ".github/trigger-add-gem-price-float-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=s

          css_needle='.float-attr-fab{position:absolute;right:16px;top:28px;z-index:100;height:42px;border:1px solid #596273;border-radius:14px;background:linear-gradient(180deg,#303641,#1b2029);color:#fff;padding:0 16px;font-weight:1000;box-shadow:0 12px 28px rgba(0,0,0,.34);cursor:pointer}'
          css_add='.float-gem-fab{right:126px}.gem-price-panel{width:min(430px,calc(100vw - 24px));right:calc((100vw - min(980px,100vw))/2 + 126px)}.gem-price-panel .float-attr-tip{margin-bottom:10px}.gem-price-panel .table-wrap{margin-top:8px}.gem-price-panel th,.gem-price-panel td{font-size:12px;padding:9px 8px}.gem-price-panel td b{color:#fff}.gem-price-panel .gem-sub{display:block;color:#6b7280;font-size:11px;margin-top:2px}'
          if '.float-gem-fab' not in s:
              s=s.replace(css_needle, css_needle+css_add, 1)

          btn_needle='<button id="attrFloatBtn" class="float-attr-fab">五维换算</button>\n<div id="attrFloatPanel" class="float-attr-panel">'
          btn_repl='<button id="gemPriceFloatBtn" class="float-attr-fab float-gem-fab">宝石价表</button>\n<button id="attrFloatBtn" class="float-attr-fab">五维换算</button>\n<div id="gemPriceFloatPanel" class="float-attr-panel gem-price-panel">\n  <div class="float-attr-head"><div class="float-attr-title">宝石价表</div><button id="gemPriceFloatClose" class="float-attr-close">×</button></div>\n  <div class="float-attr-tip">按当前1级价格计算：8段 = 255个1级，10段 = 1023个1级。</div>\n  <div class="table-wrap"><table><thead><tr><th>宝石</th><th>1级价</th><th>8段价</th><th>10段价</th></tr></thead><tbody id="gemPriceFloatBody"></tbody></table></div>\n</div>\n<div id="attrFloatPanel" class="float-attr-panel">'
          if 'gemPriceFloatBtn' not in s:
              s=s.replace(btn_needle, btn_repl, 1)

          s=s.replace('renderBuyGemTable(remain,basePrice,target);renderGemLevelTable(maxLevel,basePrice,baseBonus,attr)}', 'renderBuyGemTable(remain,basePrice,target);renderGemLevelTable(maxLevel,basePrice,baseBonus,attr);renderGemPriceFloat()}', 1)

          fn_needle='function initFloatAttr(){fillSelect(\'floatAttr1\',attrOptions);'
          fn_add="""function renderGemPriceFloat(){const body=$('gemPriceFloatBody');if(!body)return;body.innerHTML='';gems.forEach((g,i)=>{const live=i===Number($('gem').value)&&$('basePrice')?Number($('basePrice').value||g.price):Number(g.price||0),tr=document.createElement('tr');tr.innerHTML=`<td><b>${g.name}</b><span class=\"gem-sub\">+${fmt(g.bonus)}${g.attr}</span></td><td>${fmt(live)}万</td><td>${fmt(cumulativeCost(live,8))}万</td><td>${fmt(cumulativeCost(live,10))}万</td>`;body.appendChild(tr)})}\nfunction initGemPriceFloat(){const panel=$('gemPriceFloatPanel'),btn=$('gemPriceFloatBtn'),close=$('gemPriceFloatClose');if(!panel||!btn)return;btn.onclick=()=>{panel.classList.toggle('show');renderGemPriceFloat()};if(close)close.onclick=()=>panel.classList.remove('show');let dragging=false,sx=0,sy=0,sl=0,st=0;const head=panel.querySelector('.float-attr-head');function clamp(v,min,max){return Math.min(Math.max(v,min),max)}function applySaved(){try{const saved=JSON.parse(localStorage.getItem('mhxy_float_gem_price_pos')||'null');if(!saved)return;const w=panel.offsetWidth||430,h=panel.offsetHeight||300;panel.style.right='auto';panel.style.left=clamp(Number(saved.left)||8,8,Math.max(8,window.innerWidth-w-8))+'px';panel.style.top=clamp(Number(saved.top)||8,8,Math.max(8,window.innerHeight-h-8))+'px'}catch(e){}}applySaved();if(head){head.addEventListener('mousedown',e=>{if(e.button!==0||e.target.closest('button'))return;dragging=true;const r=panel.getBoundingClientRect();sx=e.clientX;sy=e.clientY;sl=r.left;st=r.top;panel.style.right='auto';panel.style.left=sl+'px';panel.style.top=st+'px';document.body.style.userSelect='';e.preventDefault()})}document.addEventListener('mousemove',e=>{if(!dragging)return;const w=panel.offsetWidth,h=panel.offsetHeight;panel.style.left=clamp(sl+e.clientX-sx,8,Math.max(8,window.innerWidth-w-8))+'px';panel.style.top=clamp(st+e.clientY-sy,8,Math.max(8,window.innerHeight-h-8))+'px'});document.addEventListener('mouseup',()=>{if(!dragging)return;dragging=false;document.body.style.userSelect='';const r=panel.getBoundingClientRect();try{localStorage.setItem('mhxy_float_gem_price_pos',JSON.stringify({left:r.left,top:r.top}))}catch(e){}});window.addEventListener('resize',applySaved);renderGemPriceFloat()}\n"""
          if 'function initGemPriceFloat' not in s:
              s=s.replace(fn_needle, fn_add+fn_needle, 1)

          s=s.replace('initGemSelect();syncGemInputs();initFloatAttr();initFloatDrag();', 'initGemSelect();syncGemInputs();initGemPriceFloat();initFloatAttr();initFloatDrag();', 1)

          checks=['gemPriceFloatBtn','gemPriceFloatPanel','gemPriceFloatBody','renderGemPriceFloat','initGemPriceFloat','cumulativeCost(live,8)','cumulativeCost(live,10)']
          miss=[c for c in checks if c not in s]
          if miss:
              raise SystemExit('verification failed: '+','.join(miss))
          if s==old:
              raise SystemExit('nothing changed')
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/add-gem-price-float.yml').unlink(missing_ok=True)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-gem-price-float.yml
          if ! git diff --cached --quiet; then
            git commit -m "Add floating gem price table"
            git push
          fi
