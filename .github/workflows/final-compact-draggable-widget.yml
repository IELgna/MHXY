name: Final compact draggable widget patch

on:
  push:
    branches: [main]
    paths:
      - ".github/final-widget-trigger-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index directly
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = s

          # Clean duplicate attr-title rules created by previous temporary patches.
          s = re.sub(r'(?:\.attr-title\{[^}]*\}(?:\.attr-form\{[^}]*\})?)+', '.attr-title{margin:16px 0 8px;padding-top:14px;border-top:1px solid var(--line);color:#e5e7eb;font-weight:900;font-size:14px}.attr-form{margin-bottom:0}', s, count=1)

          # Compact draggable panel styles.
          s = re.sub(r'\.float-attr-panel\{[^}]*\}', '.float-attr-panel{position:fixed;right:calc((100vw - min(980px,100vw))/2 + 16px);top:82px;z-index:9000;width:min(320px,calc(100vw - 24px));max-height:68vh;overflow:auto;display:none;border:1px solid #4b5563;border-radius:18px;background:rgba(17,21,27,.98);box-shadow:0 20px 56px rgba(0,0,0,.52);padding:12px}', s, count=1)
          s = re.sub(r'\.float-attr-head\{[^}]*\}', '.float-attr-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;cursor:move;user-select:none}', s, count=1)
          s = re.sub(r'\.float-attr-title\{[^}]*\}', '.float-attr-title{font-size:16px;font-weight:1000}', s, count=1)
          s = re.sub(r'\.float-attr-tip\{[^}]*\}', '.float-attr-tip{font-size:11px;line-height:1.45;color:#9ca3af;margin-bottom:9px}', s, count=1)
          s = re.sub(r'\.float-attr-grid\{[^}]*\}', '.float-attr-grid{display:grid;grid-template-columns:1fr 74px;gap:8px;margin-top:8px}', s, count=1)
          s = re.sub(r'\.float-attr-actions\{[^}]*\}', '.float-attr-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}', s, count=1)
          s = re.sub(r'\.float-attr-result\{[^}]*\}', '.float-attr-result{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}', s, count=1)
          s = re.sub(r'\.float-attr-card\{[^}]*\}', '.float-attr-card{border:1px solid #343b46;border-radius:12px;background:#171b21;padding:8px}', s, count=1)
          s = re.sub(r'\.float-attr-card \.num\{[^}]*\}', '.float-attr-card .num{font-size:16px;font-weight:1000}', s, count=1)
          s = re.sub(r'\.float-attr-detail\{[^}]*\}', '.float-attr-detail{margin-top:10px;border:1px solid #343b46;border-radius:12px;background:#0d1015;padding:8px;color:#cbd5e1;font-size:11px;line-height:1.6}', s, count=1)
          if '.float-attr-card:first-child' not in s:
              s = s.replace('.float-attr-card .num{font-size:16px;font-weight:1000}', '.float-attr-card .num{font-size:16px;font-weight:1000}.float-attr-card:first-child{grid-column:1/-1}.float-attr-actions .btn{height:34px;padding:0 10px;font-size:13px}', 1)

          drag_js = r'''
function initFloatDrag(){const panel=$('attrFloatPanel');if(!panel)return;const head=panel.querySelector('.float-attr-head');if(!head)return;let dragging=false,sx=0,sy=0,sl=0,st=0;try{const saved=JSON.parse(localStorage.getItem('mhxy_float_attr_pos')||'null');if(saved&&Number.isFinite(saved.left)&&Number.isFinite(saved.top)){panel.style.right='auto';panel.style.left=Math.max(8,Math.min(saved.left,window.innerWidth-80))+'px';panel.style.top=Math.max(8,Math.min(saved.top,window.innerHeight-80))+'px'}}catch(e){}head.addEventListener('mousedown',e=>{if(e.target.closest('button'))return;dragging=true;const r=panel.getBoundingClientRect();sx=e.clientX;sy=e.clientY;sl=r.left;st=r.top;panel.style.right='auto';panel.style.left=sl+'px';panel.style.top=st+'px';document.body.style.userSelect='none'});document.addEventListener('mousemove',e=>{if(!dragging)return;const w=panel.offsetWidth,h=panel.offsetHeight;const left=Math.min(Math.max(8,sl+e.clientX-sx),Math.max(8,window.innerWidth-w-8));const top=Math.min(Math.max(8,st+e.clientY-sy),Math.max(8,window.innerHeight-h-8));panel.style.left=left+'px';panel.style.top=top+'px'});document.addEventListener('mouseup',()=>{if(!dragging)return;dragging=false;document.body.style.userSelect='';const r=panel.getBoundingClientRect();try{localStorage.setItem('mhxy_float_attr_pos',JSON.stringify({left:r.left,top:r.top}))}catch(e){}})}
'''
          if 'function initFloatDrag()' not in s:
              s = s.replace('function initFloatAttr(){', drag_js + 'function initFloatAttr(){', 1)
          if 'initFloatDrag();' not in s:
              if 'initFloatAttr();initEvents();' in s:
                  s = s.replace('initFloatAttr();initEvents();', 'initFloatAttr();initFloatDrag();initEvents();', 1)
              else:
                  s = s.replace('initFloatAttr();', 'initFloatAttr();initFloatDrag();', 1)

          if s == old:
              raise SystemExit('no changes needed')
          p.write_text(s, encoding='utf-8')
          PY
          if git diff --quiet index.html; then
            echo "No diff"
            exit 0
          fi
          git add index.html
          git commit -m "Make five-stat panel compact draggable final"
          git pull --rebase origin main || true
          git push
