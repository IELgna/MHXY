name: Fix gem stage plan once

on:
  push:
    branches: [main]
    paths:
      - ".github/trigger-fix-gem-plan-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Patch index and remove workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          css='input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield;appearance:textfield}'
          if '::-webkit-outer-spin-button' not in s:
              s=s.replace('input,select{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:#0c0f14;color:#fff;padding:0 12px;font-size:15px;outline:none}', 'input,select{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:#0c0f14;color:#fff;padding:0 12px;font-size:15px;outline:none}'+css, 1)

          s=s.replace('<div class="result"><div class="k">目标总加成</div><div class="v" id="targetBonus"></div><div class="s">目标等级属性</div></div><div class="result"><div class="k">新增加成</div>', '<div class="result"><div class="k">还需花费</div><div class="v" id="needCost"></div><div class="s" id="needCostTip"></div></div><div class="result"><div class="k">新增加成</div>', 1)
          s=s.replace('<thead><tr><th>补充方式</th><th>单颗折合1级</th><th>还需购买</th><th>买后富余</th></tr></thead><tbody id="buyGemBody"></tbody>', '<thead><tr><th>宝石等级</th><th>本次需要</th><th>仓库/合成可用</th><th>还需购买</th><th>缺口折合1级</th></tr></thead><tbody id="buyGemBody"></tbody>', 1)
          s=s.replace('仓库已有宝石会先折合成1级数量，再计算还需要买多少个1级 / 2级 / 3级等。','仓库已有宝石会按等级向上合成后抵扣对应段数；当前升目标时会显示每一段还缺几颗对应等级宝石。')

          if 'stockMaxRendered' not in s:
              s=s.replace('cursorUnlocked={weapon:false,armor:false};', 'cursorUnlocked={weapon:false,armor:false},stockMaxRendered=0;', 1)

          stock_re = r"function stockGemId\(lv\)\{return 'stockGem'\+lv\}function getStockCount\(lv\)\{.*?\}\nfunction calcGem\(\)"
          stock_new = "function stockGemId(lv){return 'stockGem'+lv}function getStockCount(lv){const el=$(stockGemId(lv));return el?Math.max(0,Math.floor(Number(el.value||0))):0}function getStockMap(maxLv){const map={};for(let i=1;i<=maxLv;i++)map[i]=getStockCount(i);return map}function renderStockInputs(maxLv,map){const box=$('stockGemBox');if(stockMaxRendered===maxLv&&box.children.length===maxLv)return;box.innerHTML='';stockMaxRendered=maxLv;for(let lv=1;lv<=maxLv;lv++){const div=document.createElement('div');div.className='stock-item';div.innerHTML=`<label>${lv}级已有数量</label><input id=\"${stockGemId(lv)}\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\" value=\"${map[lv]||0}\">`;box.appendChild(div);$(stockGemId(lv)).addEventListener('input',calcGem)}}function analyzeGemNeed(cur,target,stock,mode){const rows=[];let carry=0,missingEq=0,ownedEq=0;for(let lv=1;lv<=target;lv++)ownedEq+=(stock[lv]||0)*p2(lv-1);if(mode==='single'){for(let lv=1;lv<=target;lv++){const available=(stock[lv]||0)+carry;if(lv<target){carry=Math.floor(available/2);continue}const unit=p2(lv-1),need=1,buy=Math.max(0,need-available);missingEq+=buy*unit;rows.push({lv,need,available,buy,eq:buy*unit})}}else{for(let lv=1;lv<=target;lv++){const unit=p2(lv-1),need=lv>cur?1:0,available=(stock[lv]||0)+carry,buy=Math.max(0,need-available);if(need>0){missingEq+=buy*unit;rows.push({lv,need,available,buy,eq:buy*unit})}const left=Math.max(0,available-need);carry=Math.floor(left/2)}}return{rows,missingEq,ownedEq}}\nfunction calcGem()"
          s, n = re.subn(stock_re, stock_new, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('stock function block replace failed')

          calc_old = "const stock=getStockMap(target),owned=Object.keys(stock).reduce((sum,lv)=>sum+stock[lv]*p2(Number(lv)-1),0),remain=Math.max(0,need-owned);renderStockInputs(target,stock);$('needGems').textContent=`${fmt(need)}个`;$('needGemsTip').textContent=gemMode==='single'?`做1颗${target}级`:`${cur}级升${target}级`;$('remainGems').textContent=`${fmt(remain)}个`;$('remainGemsTip').textContent=`仓库已有折合${fmt(owned)}个1级`;$('targetBonus').textContent=`+${fmt(targetBonus)}${attr}`;$('addedBonus').textContent=`+${fmt(addedBonus)}${attr}`;renderBuyGemTable(remain,target);"
          calc_new = "const stock=getStockMap(target);renderStockInputs(target,stock);const plan=analyzeGemNeed(cur,target,stock,gemMode),remain=plan.missingEq,owned=plan.ownedEq;$('needGems').textContent=`${fmt(need)}个`;$('needGemsTip').textContent=gemMode==='single'?`做1颗${target}级`:`${cur}级升${target}级`;$('remainGems').textContent=`${fmt(remain)}个`;$('remainGemsTip').textContent=`仓库已有折合${fmt(owned)}个1级`;$('needCost').textContent=`${fmt(remain*basePrice)}万`;$('needCostTip').textContent=`${fmt(remain)}个1级 × ${fmt(basePrice)}万`;$('addedBonus').textContent=`+${fmt(addedBonus)}${attr}`;renderBuyGemTable(plan.rows);"
          if calc_old not in s:
              raise SystemExit('calc gem middle block not found')
          s=s.replace(calc_old, calc_new, 1)

          table_re = r"function renderBuyGemTable\(remain,target\)\{.*?\}\nfunction weaponGemBasePrice"
          table_new = "function renderBuyGemTable(rows){const body=$('buyGemBody');body.innerHTML='';rows.forEach(r=>{const tr=document.createElement('tr');tr.innerHTML=`<td><b>${r.lv}级宝石</b></td><td>${fmt(r.need)}个</td><td>${fmt(r.available)}个</td><td>${fmt(r.buy)}个</td><td>${fmt(r.eq)}个1级</td>`;body.appendChild(tr)})}\nfunction weaponGemBasePrice"
          s, n = re.subn(table_re, table_new, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('buy table function replace failed')

          if 'analyzeGemNeed' not in s or '宝石等级' not in s or 'needCost' not in s or '买10级补足' in s or 'id="targetBonus"' in s:
              raise SystemExit('verification failed')
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/fix-gem-stage-plan.yml').unlink(missing_ok=True)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-gem-stage-plan.yml
          if ! git diff --cached --quiet; then
            git commit -m "Fix gem purchase plan and show needed cost"
            git push
          fi
