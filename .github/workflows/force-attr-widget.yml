name: Force attr widget

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Inject five-stat widget
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = s
          s = re.sub(r'\.attr-title\{[^}]*\}\.attr-form\{[^}]*\}(?:\.attr-title\{[^}]*\}\.attr-form\{[^}]*\})+', '.attr-title{margin:16px 0 8px;padding-top:14px;border-top:1px solid var(--line);color:#e5e7eb;font-weight:900;font-size:14px}.attr-form{margin-bottom:0}', s)
          s = s.replace('.wrap{max-width:980px;margin:0 auto;padding:28px 16px 46px}', '.wrap{max-width:980px;margin:0 auto;padding:28px 16px 46px;position:relative}')
          s = s.replace('h1{margin:0 0 8px;font-size:26px}', 'h1{margin:0 0 8px;font-size:26px;padding-right:150px}')
          s = s.replace('.desc{margin:0 0 18px;color:var(--sub);font-size:14px;line-height:1.65}', '.desc{margin:0 0 18px;color:var(--sub);font-size:14px;line-height:1.65;padding-right:150px}')
          css = ".float-attr-fab{position:absolute;right:16px;top:28px;height:42px;border:1px solid #596273;border-radius:14px;background:linear-gradient(180deg,#303641,#1b2029);color:#fff;padding:0 16px;font-weight:1000;box-shadow:0 12px 28px rgba(0,0,0,.34);cursor:pointer;z-index:20}.float-attr-panel{position:fixed;right:calc((100vw - min(980px,100vw))/2 + 16px);top:82px;z-index:9000;width:min(380px,calc(100vw - 24px));max-height:78vh;overflow:auto;display:none;border:1px solid #4b5563;border-radius:22px;background:rgba(17,21,27,.98);box-shadow:0 24px 70px rgba(0,0,0,.56);padding:15px}.float-attr-panel.show{display:block}.float-attr-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.float-attr-title{font-size:18px;font-weight:1000}.float-attr-close{width:32px;height:32px;border:1px solid var(--line);border-radius:10px;background:#1b2029;color:#e5e7eb;font-size:18px;cursor:pointer}.float-attr-tip{font-size:12px;line-height:1.55;color:#9ca3af;margin-bottom:12px}.float-attr-grid{display:grid;grid-template-columns:1fr 92px;gap:10px;margin-top:10px}.float-attr-field label{display:block;color:#9ca3af;font-size:12px;margin-bottom:6px}.float-attr-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.float-attr-result{display:grid;gap:8px;margin-top:10px}.float-attr-card{border:1px solid #343b46;border-radius:14px;background:#171b21;padding:10px}.float-attr-card .name{font-size:12px;color:#9ca3af;margin-bottom:5px}.float-attr-card .num{font-size:18px;font-weight:1000;color:#fff}.float-attr-card.main .num{color:var(--green)}.float-attr-detail{margin-top:12px;border:1px solid #343b46;border-radius:14px;background:#0d1015;padding:10px;color:#cbd5e1;font-size:12px;line-height:1.7}.float-attr-detail summary{cursor:pointer;color:#fff;font-weight:900}.float-attr-table{width:100%;margin-top:8px;font-size:12px}.float-attr-table td{white-space:normal;text-align:left;padding:7px 0;border-bottom:1px solid #28303a}"
          if '.float-attr-fab' not in s:
              s = s.replace('.cursor-tip{', css + '.cursor-tip{', 1)
          html = '''<button id="attrFloatBtn" class="float-attr-fab">五维换算</button><div id="attrFloatPanel" class="float-attr-panel"><div class="float-attr-head"><div class="float-attr-title">五维属性换算</div><button id="attrFloatClose" class="float-attr-close">×</button></div><div class="float-attr-tip">单独计算属性收益，也可以读取当前武器/衣服页面里的双加。</div><div class="float-attr-field"><label>种族</label><select id="floatRace"><option>人族</option><option>魔族</option><option>仙族</option></select></div><div class="float-attr-grid"><div class="float-attr-field"><label>属性1</label><select id="floatAttr1"></select></div><div class="float-attr-field"><label>点数</label><input id="floatVal1" type="number" step="1" value="0"></div></div><div class="float-attr-grid"><div class="float-attr-field"><label>属性2</label><select id="floatAttr2"></select></div><div class="float-attr-field"><label>点数</label><input id="floatVal2" type="number" step="1" value="0"></div></div><div class="float-attr-actions"><button class="btn primary" id="floatReadCurrent">读取当前装备双加</button><button class="btn" id="floatClear">清空</button></div><div id="floatAttrResult" class="float-attr-result"></div><details class="float-attr-detail"><summary>属性说明 / 换算表</summary><table class="float-attr-table"><tr><td><b>体质</b></td><td>人族：5气血+0.1速度+0.3灵力<br>魔族：6气血+0.1速度+0.3灵力<br>仙族：4.5气血+0.1速度+0.3灵力</td></tr><tr><td><b>魔力</b></td><td>人族：3魔法+0.7灵力<br>魔族：2.5魔法+0.7灵力<br>仙族：3.5魔法+0.7灵力</td></tr><tr><td><b>力量</b></td><td>人族：0.67伤害+0.4灵力+0.1速度<br>魔族：0.77伤害+0.4灵力+0.1速度<br>仙族：0.57伤害+0.4灵力+0.1速度</td></tr><tr><td><b>耐力</b></td><td>人族：1.5防御+0.2灵力+0.1速度<br>魔族：1.4防御+0.2灵力+0.1速度<br>仙族：1.6防御+0.2灵力+0.1速度</td></tr><tr><td><b>敏捷</b></td><td>所有种族：1敏捷 = 0.7速度，并提高一定物理躲避力</td></tr></table></details></div>'''
          if 'id="attrFloatBtn"' not in s and "id='attrFloatBtn'" not in s:
              s = s.replace("<div class='wrap'>", "<div class='wrap'>\n" + html, 1)
          js = r'''
function calcFloatAttr(){const box=$('floatAttrResult');if(!box)return;const race=$('floatRace').value,items=[[$('floatAttr1').value,Number($('floatVal1').value||0)],[$('floatAttr2').value,Number($('floatVal2').value||0)]],eff={damage:0,defense:0,hp:0,mp:0,spirit:0,speed:0,dodge:false};let total=0;items.forEach(([attr,val])=>{if(!attr||attr==='无'||!val)return;total+=val;const rates=raceRate[race][attr]||{};Object.keys(rates).forEach(k=>{if(k==='dodge')eff.dodge=true;else eff[k]+=val*rates[k]})});const rows=statOrder.filter(k=>Math.abs(eff[k])>0.00001).map(k=>`<div class="float-attr-card main"><div class="name">${statLabel[k]}</div><div class="num">${eff[k]>0?'+':''}${fmt(eff[k])}</div></div>`);if(eff.dodge)rows.push('<div class="float-attr-card"><div class="name">物理躲避</div><div class="num">提升</div></div>');if(!rows.length)rows.push('<div class="float-attr-card"><div class="name">换算结果</div><div class="num">暂无</div></div>');box.innerHTML=`<div class="float-attr-card"><div class="name">合计属性点</div><div class="num">${fmt(total)}</div></div>`+rows.join('')}
function readCurrentAttrToFloat(){const p=activePanel();if(p==='weaponCard'){$('floatRace').value=$('weaponRace').value;$('floatAttr1').value=$('weaponAttr1').value;$('floatVal1').value=$('weaponAttrVal1').value;$('floatAttr2').value=$('weaponAttr2').value;$('floatVal2').value=$('weaponAttrVal2').value}else if(p==='armorCard'){$('floatRace').value=$('armorRace').value;$('floatAttr1').value=$('armorAttr1').value;$('floatVal1').value=$('armorAttrVal1').value;$('floatAttr2').value=$('armorAttr2').value;$('floatVal2').value=$('armorAttrVal2').value}else{alert('请先切换到武器初伤或衣服初防页面。')}calcFloatAttr()}
function initFloatAttr(){if(!$('attrFloatBtn'))return;fillAttrSelect('floatAttr1');fillAttrSelect('floatAttr2');$('floatAttr1').value='力量';$('floatAttr2').value='敏捷';$('attrFloatBtn').onclick=()=>{$('attrFloatPanel').classList.toggle('show');calcFloatAttr()};$('attrFloatClose').onclick=()=>$('attrFloatPanel').classList.remove('show');$('floatReadCurrent').onclick=readCurrentAttrToFloat;$('floatClear').onclick=()=>{$('floatAttr1').value='无';$('floatVal1').value=0;$('floatAttr2').value='无';$('floatVal2').value=0;calcFloatAttr()};['floatRace','floatAttr1','floatVal1','floatAttr2','floatVal2'].forEach(id=>{$(id).addEventListener('input',calcFloatAttr);$(id).addEventListener('change',calcFloatAttr)});calcFloatAttr()}
'''
          if 'function initFloatAttr()' not in s:
              s = s.replace('function initEvents(){', js + 'function initEvents(){', 1)
          if 'initFloatAttr();' not in s:
              s = s.replace('initEvents();', 'initEvents();initFloatAttr();', 1)
          if s == old:
              raise SystemExit('no changes made')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add index.html
            git commit -m "Force inject top-right five-stat calculator"
            git push
          fi
