name: History price breakdown patch

on:
  push:
    branches: [main]
    paths:
      - ".github/trigger-history-price-breakdown-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Show total gem and equipment price in history
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=s
          # Weapon records need gemCost stored too.
          s=s.replace("gem:w.c.short,gemValue:fmt(w.c.value),base:fmt(w.baseNoGem)", "gem:w.c.short,gemValue:fmt(w.c.value),gemCost:fmt(w.gemCost),base:fmt(w.baseNoGem)", 1)
          # For old weapon records without gemCost, use 0 fallback.
          s=s.replace("const totalPrice=r.totalPrice||r.rawPrice;const div=document.createElement('div');div.className='record-card';", "const gemCost=r.gemCost||'0';const totalPrice=r.totalPrice||(r.rawPrice&&r.rawPrice!=='未填'?fmt(Number(r.rawPrice)+Number(gemCost||0)):r.rawPrice);const div=document.createElement('div');div.className='record-card';", 1)
          # Add gem price card in weapon history.
          s=s.replace("<div class=\"label\">装备总价</div><div class=\"num\">${moneyText(totalPrice)}</div></div><div class=\"side-stat\"><div class=\"label\">装备原价</div><div class=\"num\">${moneyText(r.rawPrice)}</div></div><div class=\"side-stat\"><div class=\"label\">本体初伤</div>", "<div class=\"label\">装备总价</div><div class=\"num\">${moneyText(totalPrice)}</div></div><div class=\"side-stat\"><div class=\"label\">宝石价</div><div class=\"num\">${moneyText(gemCost)}</div></div><div class=\"side-stat\"><div class=\"label\">装备原价</div><div class=\"num\">${moneyText(r.rawPrice)}</div></div><div class=\"side-stat\"><div class=\"label\">本体初伤</div>", 1)
          # Armor render: introduce gemCost local before totalPrice if not already introduced.
          s=s.replace("arr.forEach((r,i)=>{const totalPrice=r.totalPrice||(r.rawPrice&&r.gemCost&&r.rawPrice!=='未填'?fmt(Number(r.rawPrice)+Number(r.gemCost)):r.rawPrice);const div=document.createElement('div');div.className='record-card';", "arr.forEach((r,i)=>{const gemCost=r.gemCost||'0';const totalPrice=r.totalPrice||(r.rawPrice&&r.rawPrice!=='未填'?fmt(Number(r.rawPrice)+Number(gemCost||0)):r.rawPrice);const div=document.createElement('div');div.className='record-card';", 1)
          # Add gem price card in armor history.
          s=s.replace("<div class=\"label\">装备总价</div><div class=\"num\">${moneyText(totalPrice)}</div></div><div class=\"side-stat\"><div class=\"label\">装备原价</div><div class=\"num\">${moneyText(r.rawPrice)}</div></div><div class=\"side-stat\"><div class=\"label\">初防</div>", "<div class=\"label\">装备总价</div><div class=\"num\">${moneyText(totalPrice)}</div></div><div class=\"side-stat\"><div class=\"label\">宝石价</div><div class=\"num\">${moneyText(gemCost)}</div></div><div class=\"side-stat\"><div class=\"label\">装备原价</div><div class=\"num\">${moneyText(r.rawPrice)}</div></div><div class=\"side-stat\"><div class=\"label\">初防</div>", 1)
          if '宝石价' not in s or 'gemCost:fmt(w.gemCost)' not in s:
              raise SystemExit('patch verification failed')
          if s==old:
              raise SystemExit('nothing changed')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add index.html
            git commit -m "Show gem price in history cards"
            git push
          fi
