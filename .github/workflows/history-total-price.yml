name: History total price patch

on:
  push:
    branches: [main]
    paths:
      - ".github/trigger-history-total-price-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch history cards to show total price
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=s
          marker="const WKEY='mhxy_weapon_history_v4',AKEY='mhxy_armor_history_v5';"
          if 'function moneyText(v)' not in s:
              s=s.replace(marker, marker+"function moneyText(v){return !v?'-':v==='未填'?'未填':v+'万'}", 1)
          s=s.replace("arr.unshift({time:nowText(),hit:w.hit,damage:w.damage,attrs:w.attrs.text", "arr.unshift({time:nowText(),totalPrice:priceVal===null?'未填':fmt(w.price),hit:w.hit,damage:w.damage,attrs:w.attrs.text", 1)
          s=s.replace("arr.unshift({time:nowText(),defense:a.defense,attrs:a.attrs.text", "arr.unshift({time:nowText(),totalPrice:priceVal===null?'未填':fmt(a.price),defense:a.defense,attrs:a.attrs.text", 1)
          s=s.replace("arr.forEach((r,i)=>{const div=document.createElement('div');div.className='record-card';div.innerHTML=`<div class=\"record-left\"><div class=\"record-time\">${r.time}</div><div class=\"record-main\">本体初伤 ${r.base||'-'} · 净原价 ${r.netRawPrice||r.rawPrice||'-'}万</div>", "arr.forEach((r,i)=>{const totalPrice=r.totalPrice||r.rawPrice;const div=document.createElement('div');div.className='record-card';div.innerHTML=`<div class=\"record-left\"><div class=\"record-time\">${r.time}</div><div class=\"record-main\">本体初伤 ${r.base||'-'} · 装备总价 ${moneyText(totalPrice)}</div>", 1)
          s=s.replace("<div class=\"label\">净原价</div><div class=\"num\">${r.netRawPrice||r.rawPrice||'-'}万</div>", "<div class=\"label\">装备总价</div><div class=\"num\">${moneyText(totalPrice)}</div>", 1)
          s=s.replace("<div class=\"label\">装备原价</div><div class=\"num\">${r.rawPrice||'-'}万</div>", "<div class=\"label\">装备原价</div><div class=\"num\">${moneyText(r.rawPrice)}</div>", 1)
          s=s.replace("arr.forEach((r,i)=>{const div=document.createElement('div');div.className='record-card';div.innerHTML=`<div class=\"record-left\"><div class=\"record-time\">${r.time}</div><div class=\"record-main\">初防 ${r.baseDefense||'-'} · 净原价 ${r.netRawPrice||r.rawPrice||'-'}万</div>", "arr.forEach((r,i)=>{const totalPrice=r.totalPrice||(r.rawPrice&&r.gemCost&&r.rawPrice!=='未填'?fmt(Number(r.rawPrice)+Number(r.gemCost)):r.rawPrice);const div=document.createElement('div');div.className='record-card';div.innerHTML=`<div class=\"record-left\"><div class=\"record-time\">${r.time}</div><div class=\"record-main\">初防 ${r.baseDefense||'-'} · 装备总价 ${moneyText(totalPrice)}</div>", 1)
          s=s.replace("<div class=\"label\">净原价</div><div class=\"num\">${r.netRawPrice||r.rawPrice||'-'}万</div>", "<div class=\"label\">装备总价</div><div class=\"num\">${moneyText(totalPrice)}</div>", 1)
          s=s.replace("<div class=\"label\">装备原价</div><div class=\"num\">${r.rawPrice||'-'}万</div>", "<div class=\"label\">装备原价</div><div class=\"num\">${moneyText(r.rawPrice)}</div>", 1)
          if s==old:
              raise SystemExit('nothing changed')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add index.html
            git commit -m "Show total price in history cards"
            git push
          fi
