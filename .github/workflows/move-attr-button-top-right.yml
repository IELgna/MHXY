name: Move attr button top right

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Move floating attr toggle to header top right
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = text

          text = text.replace('.wrap{max-width:980px;margin:0 auto;padding:28px 16px 46px}', '.wrap{max-width:980px;margin:0 auto;padding:28px 16px 46px;position:relative}', 1)

          text = re.sub(r"\.float-attr-fab\{[^}]*\}", ".float-attr-fab{position:absolute;right:16px;top:28px;z-index:100;height:42px;border:1px solid #596273;border-radius:14px;background:linear-gradient(180deg,#303641,#1b2029);color:#fff;padding:0 16px;font-weight:1000;box-shadow:0 12px 28px rgba(0,0,0,.34);cursor:pointer}", text, count=1)
          text = re.sub(r"\.float-attr-panel\{[^}]*\}", ".float-attr-panel{position:fixed;right:calc((100vw - min(980px,100vw))/2 + 16px);top:82px;z-index:9000;width:min(380px,calc(100vw - 24px));max-height:78vh;overflow:auto;display:none;border:1px solid #4b5563;border-radius:22px;background:rgba(17,21,27,.98);box-shadow:0 24px 70px rgba(0,0,0,.56);padding:15px}", text, count=1)
          text = re.sub(r"@media\(max-width:520px\)\{\.float-attr-fab\{[^}]*\}\.float-attr-panel\{[^}]*\}\}", "@media(max-width:520px){.float-attr-fab{position:static;margin:0 0 14px auto;display:flex;align-items:center;justify-content:center;width:max-content}.float-attr-panel{right:12px;top:72px}}", text, count=1)

          if text == old:
              raise SystemExit('nothing changed')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add index.html
            git commit -m "Move five-stat toggle to header top right"
            git push
          fi
