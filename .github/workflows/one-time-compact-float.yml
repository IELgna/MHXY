name: One time compact float fix

on:
  push:
    branches: [main]
    paths:
      - ".github/trigger-compact-float-*"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact float panel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('width:min(380px,calc(100vw - 24px));max-height:78vh;overflow:auto;display:none;border:1px solid #4b5563;border-radius:22px;background:rgba(17,21,27,.98);box-shadow:0 24px 70px rgba(0,0,0,.56);padding:15px','width:min(320px,calc(100vw - 24px));max-height:68vh;overflow:auto;display:none;border:1px solid #4b5563;border-radius:18px;background:rgba(17,21,27,.98);box-shadow:0 20px 56px rgba(0,0,0,.52);padding:12px')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Compact float calculator panel" || exit 0
          git rm .github/workflows/one-time-compact-float.yml
          git add -A
          git commit -m "Remove one time workflow" || true
          git push
