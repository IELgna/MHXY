name: Patch gem cost layout online once

on:
  push:
    branches: [main]
    paths:
      - ".github/trigger-gem-cost-layout-online-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Patch index directly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=s
          # 1) Layout: gem result row becomes 5 columns, last card narrower.
          if '.results.gem-results' not in s:
              s=s.replace('.results{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}', '.results{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.results.gem-results{grid-template-columns:1fr 1fr 1fr 1fr .82fr}', 1)
          if '.result.slim .v' not in s:
              s=s.replace('.v.small{font-size:18px}', '.v.small{font-size:18px}.result.slim .v{font-size:20px}', 1)
          s=s.replace('@media(max-width:820px){.form{grid-template-columns:1fr}.results,.results.three{grid-template-columns:repeat(2,1fr)}', '@media(max-width:820px){.form{grid-template-columns:1fr}.results,.results.three,.results.gem-results{grid-template-columns:repeat(2,1fr)}', 1)
          s=s.replace('@media(max-width:520px){h1,.desc{padding-right:0}', '@media(max-width:520px){h1,.desc{padding-right:0}', 1)
          s=s.replace('.results,.results.three{grid-template-columns:1fr}', '.results,.results.three,.results.gem-results{grid-template-columns:1fr}', 1)

          # 2) Cards: change cost card to total gem price and add after-warehouse cost card.
          old_html='<div class="results"><div class="result"><div class="k">总需求折合1级</div><div class="v" id="needGems"></div><div class="s" id="needGemsTip"></div></div><div class="result main green"><div class="k">还缺折合1级</div><div class="v" id="remainGems"></div><div class="s" id="remainGemsTip"></div></div><div class="result"><div class="k">还需花费</div><div class="v" id="needCost"></div><div class="s" id="needCostTip"></div></div><div class="result"><div class="k">新增加成</div><div class="v" id="addedBonus"></div><div class="s">目标 - 当前</div></div></div>'
          new_html='<div class="results gem-results"><div class="result"><div class="k">总需求折合1级</div><div class="v" id="needGems"></div><div class="s" id="needGemsTip"></div></div><div class="result main green"><div class="k">还缺折合1级</div><div class="v" id="remainGems"></div><div class="s" id="remainGemsTip"></div></div><div class="result"><div class="k">宝石总价</div><div class="v" id="needCost"></div><div class="s" id="needCostTip"></div></div><div class="result main green"><div class="k">扣仓后还需</div><div class="v" id="netNeedCost"></div><div class="s" id="netNeedCostTip"></div></div><div class="result slim"><div class="k">新增加成</div><div class="v" id="addedBonus"></div><div class="s">目标 - 当前</div></div></div>'
          if old_html in s:
              s=s.replace(old_html,new_html,1)
          elif 'id="netNeedCost"' not in s:
              raise SystemExit('gem result cards block not found')

          # 3) Cost formula: needCost is total gem price; netNeedCost is after inventory deduction.
          old_js="$('needCost').textContent=`${fmt(remain*basePrice)}万`;$('needCostTip').textContent=`${fmt(remain)}个1级 × ${fmt(basePrice)}万`;$('addedBonus').textContent=`+${fmt(addedBonus)}${attr}`;"
          new_js="$('needCost').textContent=`${fmt(need*basePrice)}万`;$('needCostTip').textContent=`${fmt(need)}个1级 × ${fmt(basePrice)}万`;$('netNeedCost').textContent=`${fmt(remain*basePrice)}万`;$('netNeedCostTip').textContent=`扣仓后 ${fmt(remain)}个1级 × ${fmt(basePrice)}万`;$('addedBonus').textContent=`+${fmt(addedBonus)}${attr}`;"
          if old_js in s:
              s=s.replace(old_js,new_js,1)
          elif "$('netNeedCost').textContent" not in s:
              raise SystemExit('cost js block not found')

          if '宝石总价' not in s or '扣仓后还需' not in s or 'results gem-results' not in s or "$('netNeedCost').textContent" not in s:
              raise SystemExit('verification failed')
          if s==old:
              raise SystemExit('nothing changed')
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/patch-gem-cost-layout-online.yml').unlink(missing_ok=True)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-gem-cost-layout-online.yml
          if ! git diff --cached --quiet; then
            git commit -m "Update gem cost cards with inventory deduction"
            git push
          fi
