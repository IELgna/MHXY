name: Remove OCR UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Remove screenshot recognition UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = text
          text = re.sub(r"<div class='shotbox'><b>截图识别：</b>.*?id='weaponShotStatus'>等待截图</span></div></div>\n", "", text, flags=re.S)
          text = re.sub(r"<div class='shotbox'><b>截图识别：</b>.*?id='armorShotStatus'>等待截图</span></div></div>\n", "", text, flags=re.S)
          text = re.sub(r"\n<div id='ocrModal'.*?\n<script src='https://cdn.jsdelivr.net/npm/tesseract\.js@5/dist/tesseract\.min\.js'></script>", "", text, flags=re.S)
          text = text.replace('initShotTools();','')
          text = text.replace('、截图识别','')
          if text == old:
              raise SystemExit('nothing changed; OCR UI may already be removed')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add index.html
            git commit -m "Remove screenshot recognition UI"
            git push
          fi
