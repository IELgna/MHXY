<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宝石计算器</title><style>body{margin:0;background:#090b0f;color:#eee;font-family:Arial,"Microsoft YaHei"}.box{max-width:900px;margin:auto;padding:20px}.card{background:#151922;border:1px solid #303641;border-radius:18px;padding:18px;margin:15px 0}input,select,button{padding:10px;border-radius:10px;border:1px solid #444;background:#0d1015;color:#fff;margin:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{font-size:22px;color:#a7f3d0}.admin{position:fixed;bottom:8px;right:10px;opacity:.18;font-size:12px;cursor:pointer}.hide{display:none}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center}.panel{background:#151922;padding:20px;border-radius:18px}</style></head><body><div class="box"><h1>宝石与武器初伤计算器</h1><div class="card"><h3>宝石计算</h3><div class="grid"><select id="gem"></select><input id="lv" value="8" placeholder="等级"><input id="price" value="10" placeholder="1级价格"><input id="bonus" value="25" placeholder="1级属性"></div><button onclick="calc()">计算</button><div class="result" id="out"></div></div><div class="card"><h3>武器初伤</h3><div class="grid"><input id="hit" value="300" placeholder="命中"><input id="dmg" value="300" placeholder="伤害"></div><button onclick="weapon()">计算</button><div class="result" id="wout"></div></div></div><div class="admin" onclick="login()">管理</div><div id="modal" class="modal hide"><div class="panel"><h3>宝石管理</h3><input id="u" placeholder="账号"><input id="p" placeholder="密码" type="password"><button onclick="auth()">进入</button><div id="edit" class="hide"><input id="n" placeholder="宝石名称"><input id="pr" placeholder="价格"><input id="bo" placeholder="加成"><input id="at" placeholder="属性"><button onclick="add()">确认添加</button></div></div></div><script>let gems=[{n:'红玛瑙',p:10,b:25,a:'命中'},{n:'月亮石',p:14,b:12,a:'防御'},{n:'黑宝石',p:23,b:8,a:'速度'},{n:'舍利子',p:14,b:6,a:'灵力'},{n:'光芒石',p:8,b:40,a:'气血'}].concat(JSON.parse(localStorage.gems||'[]'));let G=document.getElementById('gem');function load(){G.innerHTML='';gems.forEach((x,i)=>G.innerHTML+=`<option value="${i}">${x.n} ${x.p}万 +${x.b}${x.a}</option>`)}load();function calc(){let x=gems[G.value],l=+lv.value;out.innerHTML=`需要1级宝石：${2**(l-1)}个<br>单颗价格：${x.p*2**(l-1)}万<br>累计成本：${x.p*(2**l-1)}万<br>加成：+${x.b*l}${x.a}`}function weapon(){wout.innerHTML=`显示初伤：${hit.value/3+ +dmg.value}<br>公式：${hit.value}÷3+${dmg.value}`}function login(){modal.classList.remove('hide')}function auth(){if(u.value=='admin'&&p.value=='123456'){edit.classList.remove('hide')}else alert('账号密码错误')}function add(){gems.push({n:n.value,p:+pr.value,b:+bo.value,a:at.value});localStorage.gems=JSON.stringify(gems);load();alert('添加成功')} </script></body></html>
